[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-shorts"
version = "0.1.0"
description = "ショートショート朗読動画のローカル制作パイプライン"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "soundfile",
    "pyyaml",
    "requests",
    "pyloudnorm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
